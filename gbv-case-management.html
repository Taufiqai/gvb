<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surokkha | GBV Case Response & Referral Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eeeb;--surface:#fbfcfb;--ink:#14282c;--muted:#52656a;--line:#c7d3cf;--brand:#1c5a58;--brand-ink:#ffffff;--soft:#dbe6e2;--exit:#d9531b;--high:#a8231b;--high-bg:#f6dcd8;--med:#7d5208;--med-bg:#f4e6c6;--low:#22613f;--low-bg:#d6ecdf;--focus:#d9531b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1d;--surface:#152527;--ink:#e2ebe8;--muted:#9aaeaa;--line:#2b3f42;--brand:#62b2aa;--brand-ink:#08201f;--soft:#1d3235;--high:#ff8f84;--high-bg:#3b1c1a;--med:#efc163;--med-bg:#382d14;--low:#80d2a8;--low-bg:#153223}}
:root[data-theme="dark"]{--bg:#0e1b1d;--surface:#152527;--ink:#e2ebe8;--muted:#9aaeaa;--line:#2b3f42;--brand:#62b2aa;--brand-ink:#08201f;--soft:#1d3235;--high:#ff8f84;--high-bg:#3b1c1a;--med:#efc163;--med-bg:#382d14;--low:#80d2a8;--low-bg:#153223}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Atkinson Hyperlegible','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif}
html[lang="bn"] body{font-family:'Hind Siliguri','Atkinson Hyperlegible',system-ui,sans-serif}
.top{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem;line-height:1.15}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.spacer{flex:1}
.top select{width:auto;padding:.35rem .5rem;font-size:.88rem}
.pill{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:.4rem .7rem;font:inherit;font-size:.88rem;cursor:pointer}
.exit{background:var(--exit);color:#fff;border:0;border-radius:6px;padding:.45rem .95rem;font:inherit;font-weight:700;cursor:pointer}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
nav{border-right:1px solid var(--line);padding:1rem .5rem;background:var(--surface)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:.55rem .8rem;border-radius:6px;color:var(--ink);font:inherit;cursor:pointer}
nav button:hover{background:var(--soft)}
nav button[aria-current="page"]{background:var(--soft);font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
main{padding:1.25rem clamp(1rem,3vw,2.25rem) 3rem;max-width:1080px;width:100%}
h1{font-size:1.65rem;line-height:1.2;margin:.25rem 0 .35rem}
h2{font-size:1.12rem;margin:1.8rem 0 .6rem}
h3{font-size:1rem;margin:1rem 0 .4rem}
.lede{color:var(--muted);margin:0 0 1.25rem;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}
.panel>h2:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem;margin-bottom:.5rem}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem}
.tile b{display:block;font-size:2.1rem;line-height:1.05}
.tile span{color:var(--muted);font-size:.9rem}
.tile.alert{border-color:var(--high)}
.tile.alert b{color:var(--high)}
.list{display:flex;flex-direction:column;gap:.5rem}
.row{display:flex;gap:.6rem 1rem;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.65rem .9rem;flex-wrap:wrap}
.row .meta{color:var(--muted);font-size:.88rem}
button.rowlink{all:unset;cursor:pointer;display:flex;gap:.6rem 1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.65rem .9rem}
button.rowlink:hover{border-color:var(--brand)}
button.rowlink:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.chip{display:inline-block;border-radius:999px;padding:.08rem .6rem;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.High{color:var(--high);background:var(--high-bg)}
.chip.Medium{color:var(--med);background:var(--med-bg)}
.chip.Low{color:var(--low);background:var(--low-bg)}
.chip.n{background:var(--soft);color:var(--ink);font-weight:400}
.chip.late{color:var(--high);background:transparent;border:1px solid var(--high)}
.code{font-weight:700;letter-spacing:.015em}
label{display:block;font-weight:700;margin:.85rem 0 .3rem}
input,select,textarea{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:5rem;resize:vertical}
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.4rem 0;font-weight:400;margin:0}
.check input{width:1.1rem;height:1.1rem;margin-top:.25rem;flex:none}
.radios{display:flex;gap:1.25rem;flex-wrap:wrap}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:.55rem 1.05rem;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--high);color:#fff}
.btn.sm{padding:.3rem .7rem;font-size:.88rem}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.steps{display:flex;gap:.3rem;margin:.4rem 0 1.2rem}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--brand)}
.stepname{color:var(--muted);font-size:.9rem;margin:0}
.notice{border-left:4px solid var(--brand);background:var(--soft);padding:.7rem .95rem;border-radius:4px;margin:.8rem 0;max-width:72ch}
.notice.crit{border-color:var(--high);background:var(--high-bg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.2rem 1.25rem;margin:0}
.facts div{padding:.35rem 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.82rem}
.facts dd{margin:0;font-weight:700}
.clock{position:relative;height:30px;background:var(--soft);border-radius:6px;margin:2rem .5rem 2.4rem}
.clock .fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand);opacity:.4;border-radius:6px 0 0 6px}
.clock .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.clock .mark span{position:absolute;top:100%;left:0;transform:translateX(-50%);font-size:.75rem;white-space:nowrap;margin-top:5px;color:var(--muted)}
.clock .now{position:absolute;top:-1.55rem;transform:translateX(-50%);font-size:.78rem;font-weight:700;white-space:nowrap}
.clockfacts{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.clockfacts div{background:var(--bg);border-radius:8px;padding:.6rem .8rem}
.clockfacts b{font-size:1.35rem;display:block}
.bar{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr) 2.8rem;gap:.6rem;align-items:center;margin:.35rem 0;font-size:.92rem}
.bar i{display:block;height:14px;background:var(--brand);border-radius:3px;min-width:2px}
.bar b{text-align:right}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.84rem}
td select,td input{min-width:9rem}
details.sop{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:.5rem 0;padding:0 1.1rem}
details.sop summary{cursor:pointer;padding:.85rem 0;font-weight:700}
details.sop summary small{font-weight:400;color:var(--muted);margin-left:.4rem}
.sop-body{max-width:74ch;padding-bottom:1rem}
.sop-body li{margin:.3rem 0}
.sop-body table{margin:.6rem 0}
.task{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--line)}
.task input{width:1.1rem;height:1.1rem;margin-top:.25rem;flex:none}
.task.done span{text-decoration:line-through;color:var(--muted)}
.inline{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:.5rem;align-items:end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1.25rem}
.note{padding:.6rem 0;border-bottom:1px solid var(--line)}
.note .meta{color:var(--muted);font-size:.84rem}
.muted{color:var(--muted)}.small{font-size:.86rem}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.75rem}
.svc .panel{margin:0}
.svc a{color:var(--brand);font-weight:700;font-size:1.25rem;text-decoration:none}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
#lock .panel{max-width:340px;width:100%}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1.1rem;border-radius:6px;display:none;z-index:60;max-width:90vw}
footer.credit{color:var(--muted);font-size:.84rem;margin-top:2rem}
@media (max-width:820px){
 .shell{grid-template-columns:1fr}
 nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;border-right:0;border-top:1px solid var(--line);padding:.3rem;z-index:20;gap:.2rem}
 nav button{white-space:nowrap;width:auto;text-align:center;font-size:.86rem;padding:.5rem .7rem}
 nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brand)}
 main{padding-bottom:6rem}
 .hide-m{display:none}
 #toast{bottom:5rem}
 .grid2,.inline{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

function caseRow(c,extra){

}

function vDash(){
 const act=S.cases.filter(c=>c.status!=='Closed');
 const refs=S.cases.flatMap(c=>c.referrals.map(r=>({...r,cid:c.id})));
 const waiting=refs.filter(r=>r.status==='Sent');
 if(S.role==='focal'){
  const cnt=k=>refs.filter(r=>r.status===k).length;
  return `<h1>${esc(t('nav_dash'))}</h1><p class="lede">${esc(t('ref_lede'))}</p>
  <div class="tiles">${REFST.map(s=>`<div class="tile ${s.k==='Sent'&&waiting.some(refOver)?'alert':''}"><b>${bnNum(cnt(s.k))}</b><span>${esc(rsLabel(s.k))}</span></div>`).join('')}</div>
  <h2>${esc(t('ref_late'))}</h2><div class="list">${waiting.filter(refOver).map(r=>`<div class="row"><span><span class="code">${r.cid}</span> ${esc(svcName(r.svc))}</span><span class="meta">${esc(t('sent'))} ${fDT(r.date)}</span></div>`).join('')||`<p class="muted">${esc(t('nothing'))}</p>`}</div>`;
 }
 const attn=[];
 act.forEach(c=>{const why=[];if(planOver(c))why.push(t('plan_over'));if(fuOver(c))why.push(t('fu_due'));if(c.referrals.some(refOver))why.push(t('ref_late'));if(why.length)attn.push({c,why})});
 attn.sort((a,b)=>({High:0,Medium:1,Low:2}[a.c.risk]-{High:0,Medium:1,Low:2}[b.c.risk]));
 const win=act.filter(inWindow);
 return `<h1>${esc(t('nav_dash'))}</h1><p class="lede">${esc(t('dash_lede'))}</p>
 <div class="tiles">
  <div class="tile"><b>${bnNum(act.length)}</b><span>${esc(t('open'))}</span></div>
  <div class="tile ${act.some(c=>c.risk==='High')?'alert':''}"><b>${bnNum(act.filter(c=>c.risk==='High').length)}</b><span>${esc(t('high'))}</span></div>
  <div class="tile ${act.some(fuOver)?'alert':''}"><b>${bnNum(act.filter(fuOver).length)}</b><span>${esc(t('fu_over'))}</span></div>
  <div class="tile ${waiting.some(refOver)?'alert':''}"><b>${bnNum(waiting.length)}</b><span>${esc(t('ref_wait'))}</span></div>
 </div>
 ${win.length?`<h2>${esc(t('window_t'))}</h2><div class="list">${win.map(c=>caseRow(c,`<span class="chip late">${bnNum(Math.max(0,Math.floor(120-hrsSince(c))))} ${esc(t('left'))}</span>`)).join('')}</div>`:''}
 <h2>${esc(t('attention'))}</h2>
 <div class="list">${attn.map(a=>caseRow(a.c,a.why.map(w=>`<span class="chip late">${esc(w)}</span>`).join(' '))).join('')||`<p class="muted">${esc(t('nothing'))}</p>`}</div>
 <p class="notice small">${esc(t('proto'))}</p>`;
}

 }
 return `<h1>${esc(t('new_t'))}</h1><p class="lede">${esc(t('new_lede'))}</p>

function readWiz(){
 const d=wiz.d, box=document.getElementById('wiz'); if(!box)return; const groups={};
 box.querySelectorAll('[name]').forEach(el=>{const n=el.name;
  if(el.type==='checkbox'&&el.dataset.group){groups[n]=groups[n]||[];if(el.checked)groups[n].push(el.value)}
  else if(el.type==='checkbox')d[n]=el.checked;
  else if(el.type==='radio'){if(el.checked)d[n]=el.value}
  else d[n]=el.value});
 Object.assign(d,groups);
}

function createCase(){
 readWiz(); const d=wiz.d, risk=calcRisk(d.flags,d.isChild), nowIso=new Date().toISOString();
 const inc=d.incident?new Date(d.incident):new Date();
 const id=`GBV-${d.district}-${new Date().getFullYear()}-${String(S.seq++).padStart(4,'0')}`;
 const due=days=>new Date(Date.now()+days*DAY).toISOString(), plan=[];
 if((d.type==='rape'||d.type==='sexual')&&Date.now()-inc<120*HR)plan.push({task:'Urgent medical referral: PEP, emergency contraception, forensic exam (with consent)',due:nowIso,done:false});
 if(risk==='High')plan.push({task:'Develop safety plan with the survivor',due:due(0.5),done:false});
 d.needs.forEach(k=>{const n=find(NEEDS,k);plan.push({task:'Arrange '+n.en.toLowerCase(),due:due(risk==='High'?1:3),done:false})});
 if(d.isChild)plan.push({task:'Case conference with supervisor (child survivor)',due:due(2),done:false});
 const who=d.worker||roleLabel();
 S.cases.unshift({id,created:nowIso,incident:inc.toISOString(),type:d.type,loc:d.loc,perp:d.perp,age:d.age,sex:d.sex,disab:d.disab==='yes',district:d.district,tech:!!d.tech,isChild:!!d.isChild,risk,flags:d.flags,needs:d.needs,
  consent:{services:!!d.c_services,conf:!!d.c_conf,cm:!!d.c_cm,share:!!d.c_share,date:nowIso},worker:who,status:plan.length?'Action plan':'Open',emergency:d.danger==='yes'||d.medical==='yes',planAt:plan.length?nowIso:null,
  plan,referrals:[],notes:d.summary.trim()?[{date:nowIso,by:who,text:d.summary.trim()}]:[],closure:null});
 save(); wiz=null; sel=id; view='case'; render(); toast(t('created')+': '+id);
}

function clock(c){

 const cell=(lbl,n)=>`<div><span class="small muted">${esc(lbl)}</span><b>${n>0?bnNum(n)+' '+esc(t('left')):esc(t('passed'))}</b></div>`;
 return `<section class="panel"><h2>${esc(t('clock'))}</h2>

  <div class="now" style="left:${p(h)}%">${esc(t('now'))}, ${bnNum(Math.floor(h))} h</div>
  <div class="mark" style="left:${p(72)}%"><span>72 h</span></div>
  <div class="mark" style="left:${p(120)}%"><span>120 h</span></div>
 </div>

 <p class="notice small">${esc(t('clock_note'))}</p></section>`;
}

/* ---------- SOP ---------- */
const SOP=[
{n:'0',bn:'দলিল নিয়ন্ত্রণ',en:'Document control',h:`<table><tbody>
<tr><th>Title</th><td>Standard Operating Procedure for GBV Case Response and Referral Management</td></tr>
<tr><th>Version</th><td>1.0 (draft for adoption)</td></tr>
<tr><th>Owner</th><td>[Lead agency], through the district GBV coordination forum</td></tr>
<tr><th>Applies to</th><td>All agencies that sign the district referral pathway and information-sharing protocol</td></tr>
<tr><th>Review</th><td>Every 12 months, and after any serious incident or change in law</td></tr></tbody></table>`},
{n:'1',bn:'উদ্দেশ্য ও পরিধি',en:'Purpose and scope',h:`<p>This SOP sets one way for every agency in the referral network to respond to a disclosure of gender-based violence (GBV), manage the case, and make and track referrals, so that each survivor gets timely, safe, confidential and coordinated help and tells their story as few times as possible.</p>
<p>It applies to caseworkers, case supervisors, referral focal points and data staff of government and non-government agencies in the district pathway, including One-Stop Crisis Centres and Cells, the National Helpline 109, police Victim Support Centres, legal aid offices, shelters and NGO case management agencies. It covers survivors of every age and gender; section 9 adds steps for children. It does not replace clinical protocols, police investigation procedure or court rules.</p>
<h3>Key terms</h3><ul>
<li><b>GBV:</b> any harmful act done against a person's will that is based on socially ascribed differences between women and men (IASC definition). The system uses the six GBVIMS core types.</li>
<li><b>Survivor:</b> the person who experienced the violence. The SOP uses this word throughout.</li>
<li><b>Case management:</b> a structured method in which one caseworker takes responsibility for making sure the survivor is informed of options, and that services are coordinated and followed up.</li>
<li><b>Referral:</b> a consented request to another provider to deliver a service, with feedback to the referring caseworker.</li>
<li><b>Warm referral:</b> the caseworker introduces or accompanies the survivor to the receiving provider.</li></ul>`},
{n:'2',bn:'মূলনীতি',en:'Guiding principles',h:`<ul>
<li><b>Safety first:</b> the physical and emotional safety of the survivor, their family and staff comes before any other step.</li>
<li><b>Confidentiality:</b> information is shared only with the survivor's informed consent, on a need-to-know basis, within the limits in section 8.</li>
<li><b>Respect and self-determination:</b> the survivor decides. No service, including medical care, depends on reporting to police or filing a case.</li>
<li><b>Non-discrimination:</b> equal treatment regardless of age, sex, disability, religion, ethnicity, marital status, sexual orientation, occupation or nationality.</li>
<li><b>Do no harm:</b> no repeated interviews, no victim-blaming questions, no photographs, no contact with the alleged perpetrator.</li>
<li><b>Best interests of the child:</b> the deciding test for every action involving a survivor under 18.</li>
<li><b>No informal settlement:</b> staff must never arrange or encourage salish or other informal settlement of GBV, and must never facilitate marriage of a survivor to the perpetrator.</li></ul>`},
{n:'3',bn:'আইনি ও নীতিকাঠামো',en:'Legal and policy framework',h:`<p>The SOP operates within, and does not override, the following. The lead agency should confirm the latest amendments before adoption.</p>
<ul><li>Constitution of Bangladesh: equality, non-discrimination and protection of life and personal liberty (Articles 27, 28, 31 and 32).</li>
<li>Nari O Shishu Nirjatan Daman Ain 2000 (Prevention of Oppression Against Women and Children Act), as amended.</li>
<li>Domestic Violence (Prevention and Protection) Act 2010: protection orders and service provider duties.</li>
<li>Children Act 2013: Child Affairs Police Officers, probation officers and Child Welfare Boards.</li>
<li>Child Marriage Restraint Act 2017; Dowry Prohibition Act 2018; Prevention and Suppression of Human Trafficking Act 2012; Pornography Control Act 2012.</li>
<li>Legal Aid Services Act 2000 (National Legal Aid Services Organisation).</li>
<li>Evidence Act 1872 as amended in 2022, which removed the provision allowing a complainant's character to be attacked in rape trials.</li>
<li>High Court Division guidance, including the 2009 guidelines on sexual harassment at workplaces and educational institutions, and the 2018 judgment prohibiting the "two-finger test".</li>
<li>National Women Development Policy 2011 and the national action plan on preventing violence against women and children.</li>
<li>International: CEDAW, the Convention on the Rights of the Child, IASC GBV Guidelines (2015), Interagency GBV Case Management Guidelines, Inter-Agency Minimum Standards for GBV in Emergencies (2019), and the GBVIMS.</li></ul>`},
{n:'4',bn:'ভূমিকা ও দায়িত্ব',en:'Roles and responsibilities',h:`<div class="tbl"><table><thead><tr><th>Role</th><th>Main responsibilities</th></tr></thead><tbody>
<tr><td>Any staff receiving a disclosure</td><td>Listen without judging, give accurate information about services, and with consent link the survivor to a caseworker within 24 hours. Do not investigate or record details.</td></tr>
<tr><td>Caseworker</td><td>Leads steps 1 to 6 of section 5, holds the case file, obtains consent, makes and tracks referrals, and keeps records in the system.</td></tr>
<tr><td>Case supervisor</td><td>Reviews every high-risk and child case within 48 hours, runs case conferences, signs off closure, supports staff care, and handles complaints and data breaches.</td></tr>
<tr><td>Referral focal point (each receiving agency)</td><td>Acknowledges referrals within 24 hours, reports the outcome within 48 hours, and keeps the directory entry current.</td></tr>
<tr><td>M&amp;E / information management officer</td><td>Produces aggregate reports only, applies small-cell suppression, and maintains access control and audit logs.</td></tr>
<tr><td>District GBV coordination forum</td><td>Maintains the referral pathway, resolves escalated referral failures, and reviews indicators quarterly.</td></tr></tbody></table></div>`},
{n:'5',bn:'কেস ব্যবস্থাপনার ধাপ',en:'Case management steps and timelines',h:`<div class="tbl"><table><thead><tr><th>Step</th><th>Standard time</th><th>System function</th></tr></thead><tbody>
<tr><td>5.1 First contact and immediate safety</td><td>At disclosure; linked to a caseworker within 24 h</td><td>New case, step 1</td></tr>
<tr><td>5.2 Consent, intake and assessment</td><td>Same session where possible</td><td>New case, steps 2 to 4</td></tr>
<tr><td>5.3 Case action plan</td><td>24 h for high risk; 3 working days otherwise</td><td>Action plan; overdue alert</td></tr>
<tr><td>5.4 Implementation and referral</td><td>As agreed in the plan</td><td>Referrals</td></tr>
<tr><td>5.5 Follow-up</td><td>High: every 48 h; medium: weekly; low: fortnightly</td><td>Next follow-up due; overdue alert</td></tr>
<tr><td>5.6 Closure</td><td>When criteria are met; supervisor sign-off</td><td>Case closure</td></tr></tbody></table></div>
<h3>5.1 First contact and immediate safety</h3><p>Use Look, Listen, Link (psychological first aid). If the survivor is in immediate danger, call 999 or move to a safe place. If there is a medical emergency, arrange transport to the nearest One-Stop Crisis Centre or hospital first; intake can wait.</p>
<h3>5.2 Consent, intake and assessment</h3><p>Meet in a private space with a caseworker of the sex the survivor prefers, and a trained interpreter if needed. Obtain informed consent before recording anything (section 8). Assess safety, health, psychosocial wellbeing, legal wishes and basic needs, and complete the risk assessment. Record only what services need; do not ask for details of the violence beyond what the survivor offers.</p>
<h3>5.3 Case action plan</h3><p>Agree goals and actions with the survivor, name who does what by when, and record them. For high risk, write a safety plan covering safe contacts, safe places, a code word, and what to do if the perpetrator returns.</p>
<h3>5.4 Implementation</h3><p>Deliver direct services and make referrals using section 7. Accompany the survivor for high-risk and child cases where possible.</p>
<h3>5.5 Follow-up</h3><p>Contact through the channel the survivor agreed is safe. Re-assess risk at every contact and update the plan. If a contact fails, try three times over the following week, then consult the supervisor.</p>
<h3>5.6 Closure</h3><p>Close when goals are met and the survivor is safe; the survivor asks to close; the survivor moves and the case is transferred with consent; or there has been no contact for 30 days after three attempts. The supervisor reviews and signs off. Where safe, hold a closure conversation and explain how to reopen the case.</p>`},
{n:'6',bn:'যৌন সহিংসতায় সময়-সংবেদনশীল চিকিৎসা',en:'Time-critical care after sexual violence',h:`<ul>
<li>Refer immediately for medical care. Treatment never waits for a police report, GD, FIR or court order.</li>
<li>HIV post-exposure prophylaxis must start within 72 hours; emergency contraception is effective up to 120 hours. The system shows a clinical window for every rape or sexual assault case.</li>
<li>Forensic evidence is best collected within 72 hours, but refer even later, since some evidence and the medico-legal certificate remain valuable.</li>
<li>If the survivor wants a forensic exam, advise, without insisting, that they avoid bathing or changing clothes until it is done; keep any clothing in a paper bag.</li>
<li>The exam is done by a trained provider, by a female doctor where the survivor prefers, with a female attendant present. The "two-finger test" is prohibited.</li>
<li>Examination and evidence collection need separate consent; the survivor may accept treatment and decline forensic steps.</li>
<li>Provide psychological first aid and offer referral for ongoing mental health support.</li></ul>`},
{n:'7',bn:'রেফারেল পদ্ধতি',en:'Referral procedure',h:`<h3>7.1 Consent for each referral</h3><p>Explain what information will be shared, with whom and why. Consent is recorded for each referral separately; the survivor may decline any referral without losing other services.</p>
<h3>7.2 Making the referral</h3><p>Use the standard referral form with the minimum information the receiving provider needs. Send it in person, in a sealed envelope, or through the secure system. Never send names or identifying details over unsecured messaging apps, SMS or personal email. A phone referral is followed by the form within 24 hours.</p>
<h3>7.3 Warm referral</h3><p>For high-risk cases, children and survivors with disabilities, introduce or accompany the survivor so that they do not have to explain their situation again.</p>
<h3>7.4 Feedback loop</h3><p>The receiving focal point acknowledges within 24 hours and reports the outcome (accepted, service delivered, or unable to provide) within 48 hours. The system flags any referral still marked "sent" after 48 hours.</p>
<h3>7.5 Escalation</h3><p>If a referral fails or feedback does not arrive, the caseworker contacts the focal point, then the supervisor raises it with the receiving agency's supervisor, then the district coordination forum.</p>
<h3>7.6 Keeping the pathway current</h3><p>The coordination forum updates the service directory at least every quarter, including focal points, hours, eligibility and costs.</p>`},
{n:'8',bn:'অবহিত সম্মতি ও গোপনীয়তা',en:'Informed consent and confidentiality',h:`<p>Consent is informed when the survivor understands the services offered, possible risks and benefits, what information is recorded and shared, the right to refuse or withdraw at any time, and the limits of confidentiality.</p>
<h3>Limits of confidentiality</h3><p>Information may be shared without consent only when there is an imminent risk to the life of the survivor or another person, when a child is at risk of serious harm, or under a court order. Explain these limits before the survivor discloses, and tell them if a limit has to be used.</p>
<h3>Records</h3><ul><li>The system identifies survivors by case code only.</li>
<li>Names, addresses and phone numbers stay on the paper intake and consent form, kept apart from the case file in a locked cabinet.</li>
<li>Never share case information with family members, community leaders, employers or media without explicit consent.</li>
<li>Never photograph survivors or injuries except as part of a medico-legal examination with consent.</li></ul>`},
{n:'9',bn:'শিশু ভুক্তভোগী',en:'Child survivors',h:`<ul>
<li>Every decision is tested against the child's best interests. Use trained staff, child-friendly language and a safe setting.</li>
<li>Consent follows the Caring for Child Survivors approach: for younger children, informed consent from a non-offending caregiver plus the child's assent where they can give it; older adolescents who show sufficient understanding may give their own informed consent.</li>
<li>If no safe caregiver is available, or the caregiver is the alleged perpetrator, the supervisor decides in the child's best interests and involves child protection services.</li>
<li>Every child case gets a supervisor review and case conference within 48 hours.</li>
<li>For a planned or recent child marriage, contact Child Helpline 1098 or Helpline 109 and the Upazila child marriage prevention committee through the Upazila Nirbahi Officer.</li>
<li>Where the child is in contact with the justice system, coordinate with the Child Affairs Police Officer, probation officer and Child Welfare Board under the Children Act 2013.</li></ul>`},
{n:'10',bn:'তথ্য সুরক্ষা ও তথ্য ব্যবস্থাপনা',en:'Data protection and information management',h:`<ul>
<li><b>Hosting:</b> the production system runs on government-controlled infrastructure with encryption in transit and at rest, individual log-ins, two-factor authentication for supervisors, and a full audit log.</li>
<li><b>Access by role:</b> caseworkers see their own cases; supervisors see their team's; referral focal points see only referral records sent to them; M&amp;E staff see aggregate data only.</li>
<li><b>Minimum data:</b> collect only fields services need. Use the GBVIMS classification so data are comparable across agencies.</li>
<li><b>Sharing:</b> only aggregate, anonymised statistics leave an agency, and only under an information-sharing protocol signed by all partners. Suppress any count under 5 in shared reports.</li>
<li><b>Retention:</b> the lead agency sets a retention period after closure; records are then destroyed securely.</li>
<li><b>Devices:</b> screens lock after 5 minutes; every screen has a quick-exit button; no survivor data on personal phones or messaging apps.</li>
<li><b>Breach:</b> report any suspected breach to the supervisor within 24 hours; assess the risk to survivors, inform affected survivors where it is safe, and log corrective action.</li></ul>`},
{n:'11',bn:'তত্ত্বাবধান, মান ও কর্মী-যত্ন',en:'Supervision, quality and staff care',h:`<ul>
<li>Individual supervision at least every two weeks; case conference within 48 hours for every high-risk or child case.</li>
<li>Supervisors review a sample of files monthly against this SOP.</li>
<li>Keep caseloads manageable for the risk mix; as a planning figure, around 20 to 25 active cases per full-time caseworker.</li>
<li>No one manages cases before completing training in GBV core concepts, psychological first aid, case management, child survivors and data protection.</li>
<li>Staff care: regular debriefing, access to confidential counselling, and reasonable workloads.</li>
<li>All staff sign a code of conduct on the prevention of sexual exploitation and abuse; survivors are told how to make a complaint safely.</li></ul>`},
{n:'12',bn:'পরিবীক্ষণ সূচক',en:'Monitoring indicators',h:`<div class="tbl"><table><thead><tr><th>Indicator</th><th>Target</th></tr></thead><tbody>
<tr><td>Rape survivors reaching health care within 72 hours of the incident, among those who disclose within 72 hours</td><td>100%</td></tr>
<tr><td>Case action plans completed within the standard time</td><td>90%</td></tr>
<tr><td>Referrals with outcome reported within 48 hours</td><td>85%</td></tr>
<tr><td>Follow-ups done on time</td><td>90%</td></tr>
<tr><td>Referrals made with documented survivor consent</td><td>100%</td></tr>
<tr><td>Closed cases with supervisor sign-off</td><td>100%</td></tr>
<tr><td>Survivors reporting satisfaction with services (exit feedback, where safe)</td><td>80%</td></tr></tbody></table></div>`},
{n:'13',bn:'সংযুক্তি ও ফর্ম',en:'Annexes and forms',h:`<p>Each paper form mirrors a screen in the digital system, so agencies without connectivity can follow the same process and enter data later.</p><ul>
<li>A. Intake and assessment form</li><li>B. Informed consent and assent form</li><li>C. Safety risk assessment</li><li>D. Case action plan and safety plan</li><li>E. Referral form</li><li>F. Referral feedback slip</li><li>G. Case closure form</li><li>H. Information-sharing protocol template</li><li>I. District service directory</li></ul>`}
];
function vSop(){
 return `<h1>${esc(t('sop_t'))}</h1><p class="lede">${esc(t('sop_lede'))}</p>
 ${SOP.map((s,i)=>`<details class="sop" ${i===0?'open':''}><summary>${bnNum(s.n)}. ${esc(lang()==='bn'?s.bn:s.en)}${lang()==='bn'?`<small>${esc(s.en)}</small>`:''}</summary><div class="sop-body">${s.h}</div></details>`).join('')}`;
}

/* ---------- actions ---------- */
function curCase(){return S.cases.find(x=>x.id===sel)}
function note(c,text){c.notes.push({date:new Date().toISOString(),by:roleLabel(),text})}
const ACT={
 nav(v){view=v;sel=null;if(v!=='new')wiz=null;render();window.scrollTo(0,0)},
 case(v){if(!canCase()){toast(t('no_access'));return}sel=v;view='case';render();window.scrollTo(0,0)},
 lang(){S.lang=lang()==='en'?'bn':'en';save();render()},
 lock(){lockNow()},
 exit(){quickExit()},
 wnext(){readWiz();const d=wiz.d;if(wiz.step===1&&!d.c_cm){toast(t('need_cm'));return}if(wiz.step===2&&(!d.type||!d.age)){toast(t('need_basic'));return}
  if(wiz.step===2&&d.isChild===false&&(d.age==='0–11'||d.age==='12–17'))d.isChild=true;
  wiz.step++;render();window.scrollTo(0,0)},
 wback(){readWiz();wiz.step--;render()},
 wcreate(){createCase()},
 ttask(v){const c=curCase();c.plan[+v].done=!c.plan[+v].done;save();render()},
 addtask(){const c=curCase(),tt=document.getElementById('tt').value.trim(),td=document.getElementById('td').value;if(!tt)return;c.plan.push({task:tt,due:new Date((td||new Date().toISOString().slice(0,10))+'T17:00').toISOString(),done:false});if(!c.planAt)c.planAt=new Date().toISOString();if(c.status==='Open')c.status='Action plan';save();render()},
 addref(){const c=curCase();if(!document.getElementById('rc').checked){toast(t('need_consent'));return}
  const svc=document.getElementById('rs').value;c.referrals.push({id:'R'+Date.now(),svc,note:document.getElementById('rn').value.trim(),date:new Date().toISOString(),status:'Sent',feedback:''});
  note(c,'Referral sent to '+svcName(svc)+' with survivor consent.');if(c.status!=='Closed')c.status='Follow-up';save();render();toast(t('send'))},
 addnote(){const c=curCase(),v=document.getElementById('nt').value.trim();if(!v)return;note(c,v);save();render()},
 closecase(){if(S.role!=='supervisor')return;const c=curCase();c.status='Closed';c.closure={reason:document.getElementById('cr').value,date:new Date().toISOString(),by:roleLabel()};save();render()},
 reopen(){const c=curCase();c.status='Follow-up';note(c,'Case reopened by supervisor.');c.closure=null;save();render()},
 savefb(v,b){const c=S.cases.find(x=>x.id===b.dataset.c),r=c.referrals.find(x=>x.id===v);r.feedback=document.getElementById('fb-'+v).value.trim();r.upd=new Date().toISOString();save();toast(t('done'))},
 reset(v,b){if(!b.dataset.armed){b.dataset.armed=1;b.textContent=t('again');return}const keep={lang:S.lang,role:S.role};S=seed();Object.assign(S,keep);save();view=null;sel=null;render();toast(t('done'))},
 wipe(v,b){if(!b.dataset.armed){b.dataset.armed=1;b.textContent=t('again');return}S.cases=[];save();view=null;sel=null;render();toast(t('done'))},
 unlock(){const p=document.getElementById('pin');if(p.value===PIN){document.getElementById('lock').style.display='none';p.value='';lastAct=Date.now()}else toast(t('bad_pin'))}
};
const CHG={
 role(v){S.role=v;save();view=null;sel=null;wiz=null;render()},
 fstatus(v){filt.status=v;render()},frisk(v){filt.risk=v;render()},
 fq(v){filt.q=v;render();const q=document.getElementById('fq');if(q){q.focus();q.setSelectionRange(v.length,v.length)}},
 cstatus(v){const c=curCase();c.status=v;save();render()},
 suppress(v,el){S.suppress=el.checked;save();render()},
 rstatus(v,el){const c=S.cases.find(x=>x.id===el.dataset.c),r=c.referrals.find(x=>x.id===el.dataset.r);r.status=v;r.upd=new Date().toISOString();note(c,'Referral to '+svcName(r.svc)+' marked '+v+'.');save();render()}
};

document.addEventListener('click',e=>{lastAct=Date.now();const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(ACT[a]){if(b.tagName!=='INPUT')e.preventDefault();ACT[a](b.dataset.v,b)}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.closest&&el.closest('#wiz')&&wiz){readWiz();if(el.dataset.rerender){render();return}if(wiz.step===3){const r=document.getElementById('riskLive');if(r)r.innerHTML=chip(calcRisk(wiz.d.flags,wiz.d.isChild))}return}
 const k=el.dataset.chg;if(k&&CHG[k])CHG[k](el.value,el)});
document.addEventListener('keydown',e=>{lastAct=Date.now();
 if(e.key==='Escape'){const n=Date.now();if(n-escAt<900)quickExit();escAt=n}
 if(e.key==='Enter'&&e.target.id==='pin')ACT.unlock()});
['mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));

function lockNow(){const l=document.getElementById('lock');document.getElementById('lockTitle').textContent=t('lock_t');document.getElementById('lockHint').textContent=t('lock_hint');document.getElementById('pinLabel').textContent=t('pin');document.getElementById('unlockBtn').textContent=t('unlock');l.style.display='flex';setTimeout(()=>document.getElementById('pin').focus(),50)}
setInterval(()=>{if(Date.now()-lastAct>5*60*1000&&document.getElementById('lock').style.display!=='flex')lockNow()},20000);
function quickExit(){document.getElementById('app').innerHTML='';const u='https://www.google.com/search?q=weather+today';try{window.top.location.replace(u)}catch(e){try{window.location.replace(u)}catch(e2){}}}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',3200)}

render();
})();
</script>
